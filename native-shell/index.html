<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>헬쑤</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #059669;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      .dot {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!--
      remote URL 방식이라 평소엔 이 화면이 안 보이고 배포된 웹앱이 로드된다.
      오프라인이거나 서버 연결 전 잠깐 보이는 폴백 셸.
    -->
    <div class="wrap">
      <div class="dot"></div>
      <p>헬쑤 불러오는 중…</p>
    </div>
  </body>
</html>
