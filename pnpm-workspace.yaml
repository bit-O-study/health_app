# pnpm 11+ post-install 보안 — 명시한 패키지의 install script 만 실행 허용.
# tesseract.js: WASM/worker 번들을 post-install 에서 준비하므로 반드시 허용
# (없으면 Vercel 빌드가 6~7초만에 실패).
# sharp/unrs-resolver: Next.js 가 사용하는 네이티브 바이너리.
allowBuilds:
  sharp: true
  tesseract.js: true
  unrs-resolver: true

patchedDependencies:
  '@kiwi-health/capacitor-health-connect@0.0.42': patches/@kiwi-health__capacitor-health-connect@0.0.42.patch
