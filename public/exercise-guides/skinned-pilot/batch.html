<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 운동 영상</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c151b;color:#ecf2f4;font:15px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:26px 16px}h1{font-size:24px;letter-spacing:-.6px;margin:8px 0}p{color:#9bafb9;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:2px;color:#48c4c8}label{display:block;margin:22px 0 8px;color:#adc1cb}select{width:100%;font:inherit;color:#e6f2f5;background:#192a34;border:1px solid #34505f;border-radius:10px;padding:12px}video{display:block;width:100%;aspect-ratio:1;border-radius:16px;background:#152027}nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}button{border:1px solid #31444f;border-radius:8px;background:transparent;color:#a9bcc6;font:inherit;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#173d43;border-color:#42aeb2;color:#e1ffff}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #79edee;outline-offset:3px}footer{display:flex;justify-content:space-between;gap:12px;color:#7b929f;font-size:12px;padding:16px 0}a{color:#7fced1}.spec{font-size:12px;color:#91a7b3;margin-top:8px}@media(max-width:450px){main{padding:18px 12px}h1{font-size:21px}}
</style>
<main>
<span class="eyebrow">MOVEMENT STUDY</span><h1 id="title">덤벨 컬</h1>
<div class="spec" id="spec">1080 × 1080 · 60 FPS · 8초 반복</div>
<label for="exercise">운동 선택</label>
<select id="exercise"><option value="dumbbell-biceps-curl">덤벨 컬</option><option value="hammer-curl-2">해머 컬</option><option value="dumbbell-front-raise">덤벨 프런트 레이즈</option><option value="dumbbell-shrug">덤벨 슈러그</option><option value="dumbbell-lateral-raise">덤벨 레터럴 레이즈</option></select>
<nav aria-label="영상 선택"><button data-mode="dark" aria-pressed="true">3D · 다크</button><button data-mode="light" aria-pressed="false">3D · 라이트</button><button data-mode="before" aria-pressed="false">이전 영상</button></nav>
<video id="video" controls autoplay muted loop playsinline aria-label="운동 동작 영상"></video>
<footer><span>앱 반영 전 검토본</span><a id="download" download>영상 다운로드</a></footer>
</main>
<script>
const select=document.getElementById('exercise'),video=document.getElementById('video');let mode='dark';
const requested=new URLSearchParams(location.search).get('exercise');if([...select.options].some(o=>o.value===requested))select.value=requested;
const additions=[['alternating-dumbbell-curl','얼터네이팅 덤벨 컬'],['cross-body-hammer-curl','크로스 바디 해머 컬'],['dumbbell-reverse-curl','덤벨 리버스 컬'],['single-arm-dumbbell-shoulder-press','싱글 암 덤벨 숄더 프레스']];
additions.push(['dumbbell-shoulder-press','덤벨 숄더 프레스'],['alternating-dumbbell-shoulder-press','얼터네이팅 덤벨 숄더 프레스'],['single-arm-dumbbell-front-raise','싱글 암 덤벨 프런트 레이즈'],['single-arm-dumbbell-lateral-raise','싱글 암 덤벨 레터럴 레이즈']);
additions.push(['zottman-curl','조트만 컬'],['wide-dumbbell-curl','와이드 덤벨 컬'],['scaption','스캡션'],['alternating-dumbbell-front-raise','얼터네이팅 덤벨 프런트 레이즈']);
additions.push(['barbell-curl','바벨 컬'],['reverse-barbell-curl','리버스 바벨 컬'],['wide-grip-barbell-curl','와이드 그립 바벨 컬'],['close-grip-barbell-curl','클로즈 그립 바벨 컬']);
additions.push(['barbell-shrug','바벨 슈러그'],['barbell-front-raise','바벨 프런트 레이즈'],['barbell-upright-row','바벨 업라이트 로우'],['wide-grip-upright-row','와이드 그립 업라이트 로우']);
for(const [id,name] of additions)select.add(new Option(name,id));
if(additions.some(([id])=>id===requested))select.value=requested;
if(!requested)select.value='barbell-shrug';
function update(){
 const id=select.value,lateral=id==='dumbbell-lateral-raise';
 const hasBefore=id==='dumbbell-shoulder-press'||!additions.some(([newId])=>newId===id);
 document.querySelector('[data-mode="before"]').hidden=!hasBefore;
 if(!hasBefore&&mode==='before')mode='dark';
 for(const button of document.querySelectorAll('button'))button.setAttribute('aria-pressed',String(button.dataset.mode===mode));
 const file=mode==='before'?(lateral?'lateral-raise.mp4':'../refresh-candidates/'+id+'.mp4'):(lateral?'lateral-raise-v2':id)+(mode==='dark'?'-dark':'')+'.mp4';
 document.getElementById('title').textContent=select.selectedOptions[0].textContent;
 document.title=select.selectedOptions[0].textContent+' · 3D 운동 영상';
 document.getElementById('spec').textContent=mode==='before'?'이전 방식 비교 영상':'1080 × 1080 · 60 FPS · 8초 반복';
 document.getElementById('download').href=file;video.src=file;video.play().catch(()=>{});
 history.replaceState(null,'','?exercise='+encodeURIComponent(id));
}
select.addEventListener('change',update);
for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{mode=button.dataset.mode;for(const other of document.querySelectorAll('button'))other.setAttribute('aria-pressed',String(other===button));update();});
update();
</script>
</html>
