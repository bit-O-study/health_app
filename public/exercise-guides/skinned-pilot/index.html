<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>덤벨 레터럴 레이즈 · 개선 영상</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c151b;color:#ecf2f4;font:15px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:28px 18px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}h1{font-size:23px;letter-spacing:-.6px;margin:6px 0}p{color:#9bafb9;line-height:1.6;margin:8px 0 18px}.eyebrow{font-size:12px;letter-spacing:2px;color:#48c4c8}.badge{white-space:nowrap;font-size:12px;color:#91a7b3;margin-bottom:8px}video{display:block;width:100%;aspect-ratio:1;border-radius:16px;background:#152027}nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}button{border:1px solid #31444f;border-radius:8px;background:transparent;color:#a9bcc6;font:inherit;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#173d43;border-color:#42aeb2;color:#e1ffff}button:focus-visible,a:focus-visible{outline:2px solid #79edee;outline-offset:3px}footer{display:flex;justify-content:space-between;gap:12px;color:#7b929f;font-size:12px;padding:16px 0}a{color:#7fced1} @media(max-width:450px){main{padding:20px 12px}h1{font-size:20px}header{align-items:start;flex-direction:column;gap:0}.badge{margin-top:4px}}
</style>
<main>
<header><div><span class="eyebrow">MOVEMENT STUDY</span><h1>덤벨 레터럴 레이즈</h1></div><span class="badge" id="spec">1080 × 1080 · 60 FPS</span></header>
<p>어깨와 팔의 연결, 손의 그립, 올리고 내리는 동작을 다시 다듬었습니다. <a href="batch.html">다른 운동 보기 →</a></p>
<nav aria-label="영상 선택"><button data-mode="dark" aria-pressed="true">개선 · 다크</button><button data-mode="light" aria-pressed="false">개선 · 라이트</button><button data-mode="before" aria-pressed="false">이전 영상</button></nav>
<video id="video" src="lateral-raise-v2-dark.mp4" controls autoplay muted loop playsinline aria-label="덤벨 레터럴 레이즈 시범 영상"></video>
<footer><span>8초 반복 · 앱 반영 전 검토본</span><a id="download" href="lateral-raise-v2-dark.mp4" download>영상 다운로드</a></footer>
</main>
<script>
const video=document.getElementById('video');
const files={dark:'lateral-raise-v2-dark.mp4',light:'lateral-raise-v2.mp4',before:'lateral-raise.mp4'};
for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{
 const mode=button.dataset.mode;
 for(const other of document.querySelectorAll('button'))other.setAttribute('aria-pressed',String(other===button));
 video.src=files[mode];video.play().catch(()=>{});
 document.getElementById('download').href=files[mode];
 document.getElementById('spec').textContent=(mode==='before'?'900 × 900':'1080 × 1080')+' · 60 FPS';
});
</script>
</html>
