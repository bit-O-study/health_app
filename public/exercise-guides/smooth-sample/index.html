<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>레터럴 레이즈 · 영상 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101413;color:#f4f7f5;font-family:system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:48px 24px}small{color:#75d9b3}h1{font-size:clamp(24px,4vw,36px);margin:12px 0}p{color:#adb9b3;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}article{border:1px solid #34443c;border-radius:20px;overflow:hidden;background:#1a211e}h2{font-size:17px;padding:0 20px}video{display:block;width:100%;aspect-ratio:1;background:#fafafa}.controls{display:flex;gap:10px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #4b6156;border-radius:10px;padding:12px 18px;background:#23362b;color:white;cursor:pointer}button:first-child{background:#a5edca;color:#102519}footer{font-size:13px;color:#85948b;margin-top:28px}@media(max-width:600px){main{padding:24px 16px}.grid{gap:10px}h2{font-size:14px;padding:0 10px}}
</style>
<main>
<small>헬쑤 · 운동 가이드 샘플</small><h1>레터럴 레이즈 영상 비교</h1>
<p>덤벨 레터럴 레이즈 — 기존 영상과 개선 샘플을 비교해 보세요.</p>
<div class="grid"><article><h2>기존 · 24fps</h2><video id="before" controls muted loop playsinline preload="auto" src="before.mp4"></video></article><article><h2>팔 길이 고정 · 60fps</h2><video id="after" controls muted loop playsinline preload="auto" src="dumbbell-lateral-raise.mp4?v=rigid2"></video></article></div>
<div class="controls"><button id="play">처음부터 함께 재생</button><button id="pause">일시정지</button><select id="speed" aria-label="재생 속도"><option value="1">정상 속도</option><option value="0.5">0.5배속</option></select><button id="theme">다크 영상 보기</button></div>
<footer>수정 샘플 720 × 720 · 8초 반복 · 팔 길이를 고정한 2D 회전 방식입니다.<br>색을 섞는 프레임 보간을 제거했습니다. 원본 확대 출력으로, 원본보다 세부 묘사가 늘어난 것은 아닙니다.</footer>
</main>
<script>
const videos=[document.querySelector('#before'),document.querySelector('#after')];let dark=false;
document.querySelector('#play').onclick=async()=>{videos.forEach(v=>v.currentTime=0);await Promise.all(videos.map(v=>v.play()));};
document.querySelector('#pause').onclick=()=>videos.forEach(v=>v.pause());
document.querySelector('#speed').onchange=e=>videos.forEach(v=>v.playbackRate=Number(e.target.value));
document.querySelector('#theme').onclick=e=>{dark=!dark;videos.forEach((v,i)=>{v.src=(i?'dumbbell-lateral-raise':'before')+(dark?'-dark':'')+'.mp4?v=rigid2';v.load();});e.target.textContent=dark?'라이트 영상 보기':'다크 영상 보기';};
</script>
</html>
