<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>오프라인 · 헬쑤</title>
    <!--
      🔴 이 파일은 **혼자 떠야 한다.** service worker 가 네트워크가 죽었을 때 내놓는
      화면이라, 바깥에서 불러오는 CSS·폰트·스크립트가 하나라도 있으면 그것도 같이
      실패해서 깨진 화면이 뜬다. 그래서 전부 인라인이고 이미지는 SVG 로 그린다.

      🔴 개인 데이터는 한 글자도 없다. 방문했던 페이지를 캐시해 다시 보여주면
      어제의 루틴·완료 기록이 오늘 것처럼 보인다 — 그건 빈 화면보다 나쁘다.
      대기 건수만 기기에 저장된 큐에서 읽어 보여준다(서버와 무관).
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --card: #ffffff;
        --line: #e4e4e7;
        --brand: #087f5b;
        --amber-bg: #fffbeb;
        --amber-line: #fcd34d;
        --amber-fg: #78350f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --card: #18181b;
          --line: #27272a;
          --amber-bg: rgba(245, 158, 11, 0.1);
          --amber-line: rgba(245, 158, 11, 0.4);
          --amber-fg: #fcd34d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      .icon { color: var(--muted); margin-bottom: 20px; }
      h1 { margin: 0 0 10px; font-size: 20px; font-weight: 800; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.65; color: var(--muted); }
      .queue {
        display: none;
        margin: 0 0 20px;
        padding: 12px 14px;
        border: 1px solid var(--amber-line);
        background: var(--amber-bg);
        color: var(--amber-fg);
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.6;
        text-align: left;
      }
      .queue strong { font-weight: 800; }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .hint { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <svg class="icon" width="56" height="56" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M2 2l20 20" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
        <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>

      <h1>오프라인이에요</h1>
      <p>
        인터넷에 연결되어 있지 않아 화면을 불러오지 못했어요.<br />
        연결되면 다시 시도해 주세요.
      </p>

      <div class="queue" id="queue"></div>

      <button type="button" id="retry">다시 시도</button>
      <p class="hint">연결이 돌아오면 자동으로 앱으로 돌아갑니다.</p>
    </main>

    <script>
      (function () {
        // 기기에 담긴 대기 기록을 읽어 "네 세트는 안전하다" 고 알린다.
        // (키는 src/lib/offline/pending-store.ts 와 같아야 한다.)
        try {
          var raw = localStorage.getItem("helssu:pending-writes:v1");
          var list = raw ? JSON.parse(raw) : [];
          if (Array.isArray(list) && list.length > 0) {
            var names = [];
            for (var i = 0; i < list.length; i++) {
              var n = list[i] && list[i].name;
              if (n && names.indexOf(n) === -1) names.push(n);
            }
            var box = document.getElementById("queue");
            box.style.display = "block";
            box.innerHTML =
              "운동 기록 <strong>" + list.length + "건</strong>이 이 기기에 저장돼 있어요. " +
              "연결되면 자동으로 올라갑니다." +
              (names.length ? "<br>" + names.join(", ") : "");
          }
        } catch (e) {
          /* localStorage 접근 불가(시크릿 모드 등) — 안내만 생략한다 */
        }

        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });
        // 연결이 돌아오면 사용자가 아무것도 안 눌러도 앱으로 복귀.
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
