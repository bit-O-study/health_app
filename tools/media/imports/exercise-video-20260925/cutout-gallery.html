<script>const select=document.getElementById('exercise');const requested=new URLSearchParams(location.search).get('exercise');select.value=Array.from(select.options).some(o=>o.value===requested)?requested:'dumbbell-front-raise';function update(){const candidate=select.value==='candidate'||select.value==='wrist-candidate';const base=select.value==='wrist-candidate'?'wrist-curl-16/public/exercise-guides/ai-v3/behind-the-back-wrist-curl':select.value==='candidate'?'low-bar-reference/public/exercise-guides/ai-v3/low-bar-squat':'../../../../public/exercise-guides/ai-v3/'+select.value;for(const theme of ['light','dark']){const v=document.getElementById(theme);v.pause();v.src=base+(theme==='dark'?'-dark':'')+'.mp4';v.load();}document.getElementById('status').textContent=candidate?'보정 중 후보 · 공개 승인 전':'현재 검토 통과 목록의 영상';}select.addEventListener('change',update);update();</script></html>
